# Copy to locations.yaml and replace placeholders locally.
# One Prometheus endpoint per location; list every cluster scraped by it.
# prometheus_label_value must exactly match the Prometheus "cluster" label.
# Do not commit live Prometheus addresses or credentials.
locations:
  - id: lab
    name: LAB
    prometheus:
      host: "PROMETHEUS_HOST"
      port: 9090
      scheme: "http"
    clusters:
      - id: miniotestcl02
        name: MinIO Test Cluster 02
        prometheus_label_value: "miniotestcl02.example.com"
