    name: DEL
    prometheus:
      host: "PROMETHEUS_HOST"
      port: 9090
      scheme: "http"
    clusters:
      - id: del01
        name: DEL01

  - id: blr
    name: BLR
    prometheus:
      host: "PROMETHEUS_HOST"
      port: 9090
      scheme: "http"
    clusters:
      - id: blr01
        name: BLR01
